# Cross-service integration plan.
# Bodies stay in the owning repositories. This map owns journeys, ownership, contracts,
# gates and the startable/blocked slice view. Validate with ../validate_work.py.
kind: integration-plan
version: 1
id: identity-platform
updated: 2026-11-08
status: active
ownership:
  iam:
    repo: ~/repositories/iam
    owns:
    - authentication, sessions, DPoP, activation
    - onboarding relay and app-scoped snapshot
    - identity contract bundle (read-only for consumers)
  ums:
    repo: ~/repositories/ums
    owns:
    - Member Profile lifecycle and storage
    - profile readiness, closure, retention, erasure
    - ums.profile.state-changed.v1
  dutch:
    repo: ~/repositories/dutch
    owns:
    - Member identity, placeholders, claims, canonicalization
    - Member association and mapping
    - Ledger authorization and domain permissions
    - dutch.member-profile.mapping-changed.v1
  dutch-ref:
    repo: ~/repositories/dutch
    role: reference-adapter
    owns:
    - contract fixtures and adapter evidence only (ADR 0009)
    excludes:
    - production provider behaviour
# Contract identity, ownership, artifacts and pins live in ../../contracts/registry.yaml.
# This map keeps only the ids the journeys below reference, plus the task that delivers each.
contracts:
- id: iam.app-subject.onboarding-ready.v1
  kind: event
  task: iam/W-8
- id: iam.onboarding-snapshot.v1
  kind: http
  task: iam/W-9
- id: ums.profile.state-changed.v1
  kind: event
  task: ums/W-12
- id: ums.profile-status.v1
  kind: http
  task: ums/W-7
- id: dutch.member-profile.mapping-changed.v1
  kind: event
  task: dutch-ref/W10-A
- id: ums.profile.association-report.v1
  kind: event
  task: ums/W-8
- id: dutch.profile-state.v1
  kind: http
  task: dutch-ref/W10-C
journeys:
- id: onboarding
  goal: A person enters through IAM, receives a UMS profile, and is associated as a Dutch Member.
  contract_decision: onboarding-contract-ownership-001
  steps:
  - service: iam
    action: authenticate and activate the app subject
    task: iam/W-8
  - service: iam
    action: publish onboarding-ready
    task: iam/W-8
    contract: iam.app-subject.onboarding-ready.v1
  - service: iam
    action: serve the app-scoped snapshot
    task: iam/W-9
    contract: iam.onboarding-snapshot.v1
  - service: ums
    action: ingest lifecycle facts
    task: ums/W-6
    contract: iam.app-subject.onboarding-ready.v1
  - service: ums
    action: serve the app-scoped profile
    task: ums/W-7
    contract: ums.profile-status.v1
  - service: dutch
    action: maintain the Member mapping
    task: dutch-ref/W10-A
    contract: dutch.member-profile.mapping-changed.v1
  - service: dutch
    action: gate the profile-required shell
    task: dutch-ref/W10-C
    contract: dutch.profile-state.v1
  gates:
  - ums/W-18
  - iam/W-13
  state: partial
- id: profile-required-ready
  goal: IAM, UMS and Dutch agree on when a profile is required versus ready.
  steps:
  - service: ums
    action: return 200 profile-required instead of an error
    task: ums/W-7
  - service: dutch-ref
    action: prove the same split against the pinned contracts
    task: dutch-ref/W12-A
  - service: dutch-ref
    action: align correlation and error envelopes
    task: dutch-ref/W12-B
  - service: dutch-ref
    action: prove the journey
    task: dutch-ref/W12-C
  gates:
  - ums/W-18
  state: coordinated
- id: profile-state-change
  goal: Profile closure, reactivation, updates and erasure are visible to Dutch without leaking identity.
  steps:
  - service: ums
    action: close on app departure
    task: ums/W-1
  - service: ums
    action: reopen deliberately
    task: ums/W-2
  - service: ums
    action: erase after retention
    task: ums/W-3
  - service: ums
    action: apply IAM-global deletion causes
    task: ums/W-4
  - service: ums
    action: relay outbox facts
    task: ums/W-12
    contract: ums.profile.state-changed.v1
  - service: ums
    action: report the association
    task: ums/W-8
    contract: ums.profile.association-report.v1
  - service: dutch
    action: update the Member mapping
    task: dutch-ref/W10-A
    contract: dutch.member-profile.mapping-changed.v1
  gates:
  - ums/W-18
  state: partial
- id: deletion-erasure
  goal: Deletion obligations are independent, durable, and survive restore.
  steps:
  - service: ums
    action: enforce the retention schedule
    task: ums/W-13
  - service: ums
    action: prove erasure survives backup restore
    task: ums/W-14
  - service: ums
    action: rehearse schema upgrade and rollback
    task: ums/W-17
  gates:
  - ums/W-18
  state: blocked
- id: snapshot-repair
  goal: Delivery faults are recoverable without duplicating profiles or waiving erasure fences.
  steps:
  - service: iam
    action: relay with durable leases
    task: iam/W-9
  - service: ums
    action: authenticate onboarding ingress and exercise snapshot repair with checkpoints and quarantine
    task: ums/IAM-RUNTIME-INGRESS
  - service: iam
    action: prove delivery faults and snapshot repair
    task: iam/W-13
  gates:
  - ums/W-18
  - iam/W-13
  state: blocked
- id: member-association
  goal: Dutch owns the Member; UMS reports only app-scoped facts.
  steps:
  - service: ums
    action: produce the association report
    task: ums/W-8
    contract: ums.profile.association-report.v1
  - service: dutch
    action: receive the authenticated association report and apply the Dutch projection
    task: dutch/UMS-RUNTIME-BINDING
    contract: ums.profile.association-report.v1
  - service: dutch
    action: keep Ledger rules Dutch-owned
    task: dutch/PROFILE-BINDING
  - service: ums
    action: prove the real journey
    task: ums/W-18
  gates:
  - ums/W-18
  state: blocked
- id: deployment
  goal: IAM runs outside tests with real issuer, keys, transport, workload auth and operational gates.
  steps:
  - service: iam
    action: package and configure a runnable runtime
    task: iam/DEP-1
  - service: iam
    action: publish onboarding events through a real transport
    task: iam/DEP-2
  - service: iam
    action: authenticate the workload snapshot
    task: iam/DEP-3
  - service: iam
    action: serve the real issuer over TLS
    task: iam/DEP-4
  - service: iam
    action: prove a private staging deployment
    task: iam/DEP-5
  - service: iam
    action: meet production operational gates
    task: iam/DEP-6
  gates:
  - iam/DEP-5
  - iam/DEP-6
  state: partial
slices:
- id: retention-core
  state: startable
  agent: ums
  tasks:
  - ums/W-1
  - ums/W-2
  - ums/W-3
  - ums/W-4
  - ums/W-10
  next: finish W-3, then W-4; W-10 follows W-1
- id: caller-authority
  state: startable
  agent: ums
  tasks:
  - ums/W-5
  next: W-5 unblocks W-6 and W-7
- id: delivery-relay
  state: owner-confirmation
  agent: ums
  tasks:
  - ums/W-12
  note: no dependency; the recorded owner must confirm before it is claimed
- id: retention-schedule
  state: blocked
  agent: ums
  blocked_by:
  - ums/W-12
  tasks:
  - ums/W-13
  - ums/W-14
  - ums/W-17
- id: content-avatar
  state: blocked
  agent: ums
  blocked_by:
  - ums/W-7
  tasks:
  - ums/W-11
  - ums/W-16
- id: export
  state: blocked
  agent: ums
  blocked_by:
  - ums/W-7
  tasks:
  - ums/W-9
- id: profile-http
  state: blocked
  agent: ums
  blocked_by:
  - ums/W-5
  tasks:
  - ums/W-7
- id: profile-state
  state: coordinated
  agents:
  - ums
  tasks:
  - ums/W-7
  - dutch-ref/W12-A
  - dutch-ref/W12-B
  - dutch-ref/W12-C
  note: One state vocabulary across Dutch and UMS; IAM supplies auth/token facts. The former iam/W-12 was retired as a duplicate.
- id: member-association
  state: blocked
  agent: ums
  blocked_by:
  - ums/W-7
  tasks:
  - ums/W-8
  - ums/W-18
- id: end-to-end
  state: blocked
  blocked_by:
  - iam/DEP-2
  - iam/DEP-3
  - ums/DUTCH-BINDING
  - dutch/PROFILE-BINDING
  - ums/IAM-RUNTIME-INGRESS
  - dutch/UMS-RUNTIME-BINDING
  tasks:
  - ums/W-18
  - iam/W-13
- id: iam-packaging
  state: coordinated
  agent: iam
  tasks:
  - iam/DEP-1
  note: Local packaging is integrated in IAM commit ed5effa with strict image-build and outage/recovery evidence.
- id: iam-runtime-adapters
  state: coordinated
  agent: iam
  tasks:
  - iam/DEP-2
  - iam/DEP-3
  - iam/DEP-4
  note: HTTP transport, scheduler and the workload token profile are green; DEP-4 key custody remains.
- id: iam-staging
  state: blocked
  agent: iam
  blocked_by:
  - iam/DEP-2
  - iam/DEP-3
  - iam/DEP-4
  tasks:
  - iam/DEP-5
- id: iam-production
  state: blocked
  agent: iam
  blocked_by:
  - iam/W-14
  - iam/DEP-5
  tasks:
  - iam/DEP-6
agent_start:
  iam:
    state: startable
    tasks:
    - iam/DEP-2
    - iam/DEP-3
    - iam/DEP-4
    - iam/DEP-7
    hold:
    - iam/W-13
    - iam/W-14
    - iam/DEP-5
    - iam/DEP-6
  ums:
    state: startable
    tasks:
    - ums/DUTCH-BINDING
    hold:
    - ums/W-18
  dutch:
    state: startable
    tasks:
    - dutch/PROFILE-BINDING
    hold:
    - dutch/NATIVE-AUTH
    - dutch/S7
open_decisions:
- id: iam-deployment-target
  owner: portfolio
  question: 'Private staging target: GCP Cloud Run + Cloud SQL, or a GCE VM + Cloud SQL?'
reconciliation:
  date: 2026-11-01
  contract_decision: onboarding-contract-ownership-001
  boards_synced: true
  edges_source: UMS work-items 'Depends on' lines plus IAM W-12-W-14
  remaining:
  - central home has no git remote
  - UMS W-4–W-18 statuses are a baseline, not owner-verified evidence
